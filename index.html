<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Zamy ❤️ Jani</title>
  <link rel="stylesheet" href="style.css" />
  <link href="https://fonts.googleapis.com/css2?family=Dancing+Script:wght@700&family=Poppins:wght@300;600&display=swap" rel="stylesheet" />
</head>
<body>
  <!-- Corazones flotantes -->
  <div class="hearts-container" id="hearts"></div>

  <main class="card">
    <h1 class="title">Zamy <span class="heart">❤️</span> Jani</h1>
    <p class="subtitle">Mi esposa, mi amor eterno</p>

    <p class="frase">
      "Cada día a tu lado es mi historia de amor favorita.
      Eres mi hoy, mi mañana y mi siempre."
    </p>

    <div class="question">
      <p class="ask">¿Aceptas esta cita conmigo? ❤️</p>

      <div class="buttons">
        <button id="yesBtn" class="btn-yes">SÍ, OBVIO 😍</button>
        <button id="noBtn" class="btn-no">no</button>
      </div>
    </div>
  </main>

  <!-- Modal de victoria -->
  <div class="modal" id="modal">
    <div class="modal-content">
      <h2>¡Sabía que dirías que sí! 💖</h2>
      <p>Te amo, Jani. Gracias por ser mi esposa. 🌹</p>
      <div class="big-heart">❤️</div>
    </div>
  </div>

  <script src="script.js"></script>
</body>
</html>
